abstract: >
  Retrieval-augmented generation (RAG) lets chatbots answer from an organisation's
  own documents but widens the attack surface: untrusted retrieved content and user
  input reach the model and its tools directly, exposing prompt injection, data
  leakage, and tool abuse. A common defence relies on the underlying model's
  alignment, which varies by model and is hard to audit. This paper studies an
  AI-aware security gateway that enforces structural controls (input filtering,
  retrieval authorisation, context quarantine, output redaction, and scoped tool use)
  independently of the model. We harden an open-source RAG security tool into a
  deployable gateway, integrate it with a retrieval-augmented chatbot over a real
  tourism-services knowledge base, and evaluate it against four OWASP LLM Top-10
  attack classes. For several open-source models we measure a guardrails-off baseline
  and compare it with the gateway enabled, separating model alignment from
  model-independent structural controls.
