abstract: >
  Retrieval-augmented generation (RAG) lets chatbots answer from an organisation's
  own documents but widens the attack surface: untrusted retrieved content and user
  input reach the model and its tools directly, opening the door to prompt injection,
  retrieval-time data leakage, and tool abuse. The common defence is to trust the
  underlying model's safety alignment, which varies from model to model and is hard to
  audit. We present an AI-aware security gateway that sits on the RAG pipeline and
  enforces five structural controls (input filtering, retrieval authorisation, context
  quarantine, output redaction, and scoped tool use) independently of the model that
  generates the answer. We map these controls onto the OWASP Top 10 for LLM Applications
  and integrate the gateway with a retrieval-augmented chatbot wired to a live tourism
  platform's document store and identity provider, evaluating it on a controlled
  synthetic corpus. Across the deterministic worst case and six open-source models (7B-70B),
  attack success with the gateway on is zero for every model on all six evaluated OWASP
  classes, while the guardrails-off baseline varies from model to model. A factorial
  analysis attributes this to the structural controls rather than to a hardened prompt,
  and the gateway neutralises attacks that two off-the-shelf guardrail systems
  (Llama Guard and NeMo Guardrails) miss. Model-independent safety thus comes from the
  gateway's structural controls, which hold by position in the pipeline, rather than
  from any individual model's alignment.
